<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>風自然班表 - 全員休假總覽</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="print.css" media="print">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div id="header" class="no-print"></div>
  <div class="wrap">
    <div class="bar" id="monthBar"></div>
    <div id="gate"></div>
    <div id="matrix"></div>
    <div id="conflicts"></div>
    <div class="actions no-print">
      <button id="exportCsv" class="btn">匯出 CSV</button>
      <button id="print" class="btn">列印</button>
    </div>
  </div>
  <script type="module" src="overview.js"></script>

</html>
