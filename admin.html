<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>風自然班表 - 主管後台</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="print.css" media="print">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div id="header" class="no-print"></div>
  <div class="wrap">
    <div class="tabs no-print" id="tabs">
      <button class="tab-btn active" data-tab="employees">員工管理</button>
      <button class="tab-btn" data-tab="shiftTypes">班別設定</button>
      <button class="tab-btn" data-tab="groups">代理人組別</button>
      <button class="tab-btn" data-tab="months">月份管理</button>
      <button class="tab-btn" data-tab="settings">假日與週末規則</button>
      <button class="tab-btn" data-tab="lastModified">最後修改時間</button>
    </div>
    <div id="content" class="panel"></div>
    <div class="actions no-print">
      <button id="exportCsv" class="btn">匯出本頁 CSV</button>
      <button id="print" class="btn">列印本頁</button>
    </div>
    <div id="msg" class="msg"></div>
  </div>
  <script type="module" src="admin.js"></script>
</body>
</html>
