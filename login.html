<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>風自然班表</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="wrap narrow">
    <div class="card">
      <h1 class="app-title">風自然班表</h1>
      <h2>登入</h2>
      <form id="loginForm">
        <div class="field">
          <label for="prefix">員工帳號前綴</label>
          <input id="prefix" type="text" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="pw">密碼</label>
          <div class="pw-wrap">
            <input id="pw" type="password" autocomplete="current-password" required>
            <span id="pwSlot"></span>
          </div>
        </div>
        <button class="btn btn-primary" type="submit">登入</button>
        <div id="msg" class="msg"></div>
      </form>

      <div id="firstLogin" hidden>
        <hr>
        <h3>首次登入：請設定新密碼</h3>
        <div class="field">
          <label for="newPw">新密碼</label>
          <div class="pw-wrap">
            <input id="newPw" type="password" autocomplete="new-password">
            <span id="newPwSlot"></span>
          </div>
        </div>
        <div class="field">
          <label for="newPw2">確認新密碼</label>
          <input id="newPw2" type="password" autocomplete="new-password">
        </div>
        <button id="changePwBtn" class="btn btn-primary" type="button">設定新密碼</button>
        <div id="msg2" class="msg"></div>
      </div>

      <hr>
      <div class="hint" style="text-align:center"><a href="setup.html">帳號建立說明</a></div>
    </div>
  </div>
  <script type="module" src="login.js"></script>
</body>
</html>
