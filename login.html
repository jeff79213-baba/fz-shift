<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>風自然班表 - 登入</title>
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div class="wrap">
        <h1>風自然班表</h1>
        <div class="card">
            <h2>登入</h2>
            <form id="loginForm">
                <div class="field">
                    <label for="prefix">員工帳號前綴</label>
                    <input type="text" id="prefix" name="prefix" required>
                </div>
                <div class="field pw-wrap">
                    <label for="pw">密碼</label>
                    <input type="password" id="pw" name="pw" required autocomplete="current-password">
                    <button type="button" class="pw-toggle" data-target="pw" aria-label="顯示密碼">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
                <button type="submit" class="btn btn-primary">登入</button>
                <div id="msg" class="msg"></div>
            </form>
            <hr>
            <div style="text-align:center">
                <a href="setup.html">首次設定主管帳號</a>
            </div>
        </div>
    </div>
    <script src="src/auth.js"></script>
    <script src="src/firebase-init.js"></script>
    <script src="src/ui/pw-toggle.js"></script>
    <script>
window.__fb = initFirebase();

const { login, loadProfile, requireRole, toEmail } = auth;

// 密碼顯示/隱藏切換按鈕
document.querySelectorAll('.pw-toggle').forEach(btn => {
  btn.addEventListener('click', function() {
    const targetId = this.dataset.target;
    const inp = document.getElementById(targetId);
    const show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    this.innerHTML = show
      ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
      : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  });
});

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.textContent = '';
  msg.className = 'msg';

  try {
    const prefix = document.getElementById('prefix').value.trim();
    const password = document.getElementById('pw').value;

    // 基本驗證
    if (!prefix) { msg.textContent = '請輸入員工帳號前綴'; msg.classList.add('error'); return; }
    if (!password) { msg.textContent = '請輸入密碼'; msg.classList.add('error'); return; }

    const { user } = await login(prefix, password);
    let profile = await loadProfile(user.uid);

    if (!profile || profile.active === false) {
      await logout();
      msg.textContent = '帳號未啟用或不存在';
      msg.classList.add('error');
      return;
    }

    if (profile.mustChangePassword) {
      const newPassword = prompt('首次登入請設定新密碼（≥8 碼含英數）');
      if (!newPassword) {
        await logout();
        msg.textContent = '需先更改密碼';
        msg.classList.add('error');
        return;
      }
      await auth.changeMyPassword(password, newPassword);
      profile = { ...profile, mustChangePassword: false };
    }

    // 根據角色導向
    if (profile.shiftRole === 'manager') {
      location.href = 'admin.html';
    } else {
      location.href = 'index.html';
    }
  } catch (err) {
    msg.textContent = err.message || '登入失敗';
    msg.classList.add('error');
  }
});
</script>
</body>
</html>
